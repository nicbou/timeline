[tools]
python = "3.14"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[hooks]
enter = "uv pip install -e ."

[tasks.test]
run = "uv run pytest"

[tasks.serve]
run = "timeline $TIMELINE_FILES_PATH -s 8080 --maps-key $GOOGLE_MAPS_API_KEY"

[tasks.dev]
run = "timeline $TIMELINE_FILES_PATH -s 8080 --maps-key $GOOGLE_MAPS_API_KEY --live-templates"
